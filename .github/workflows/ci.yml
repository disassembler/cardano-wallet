name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nix eval-cache uses POSIX write locks on ~/.cache/nix/eval-cache-v5/*.sqlite.
  # All runners share the same OS user, so one evaluating job blocks every other
  # nix command. Per-job XDG_CACHE_HOME eliminates the contention.
  XDG_CACHE_HOME: /tmp/nix-eval-cache/${{ github.job }}

jobs:

  build-gate-quality:
    if: vars.HAS_NIX_RUNNER != 'false'
    name: "Build Gate (Dev Shell)"
    runs-on: nix-enabled-runners
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check nix version
        # A precondition, and informational: each runner's reported version
        # lands in the run summary, so a fleet that has drifted is visible
        # without opening a log. Nothing is asserted against it — a staged
        # runner upgrade is a normal state, not a fault.
        run: |
          nix --version
          echo "- ${{ github.job }} on ${RUNNER_NAME:-unknown}: $(nix --version)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build dev shell
        run: nix build --quiet .#devShells.x86_64-linux.default.inputDerivation


  # ---------------------------------------------------------------------------
  # Code quality (needs: build-gate-quality)
  # ---------------------------------------------------------------------------

  quality-checks:
    if: vars.HAS_NIX_RUNNER != 'false'
    name: ${{ matrix.name }}
    needs: build-gate-quality
    runs-on: nix-enabled-runners
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Check Code Format"
            command: nix develop --quiet --command scripts/ci/check-code-format.sh

          - name: "Check HLint"
            command: nix develop --quiet --command bash -c "echo +++ HLint ; hlint lib"

          - name: "Check Cabal Configure"
            command: nix develop --quiet --command scripts/ci/check-haskell-nix-cabal.sh

          - name: "Check Local Cabal Test Targets"
            command: scripts/ci/check-local-test-targets.sh

          - name: "Test PR Body Closing Link"
            command: scripts/ci/test-pr-body-closing-link.sh

          - name: "Validate PR Body Closing Link"
            command: scripts/ci/check-pr-body-closing-link.sh

          - name: "Lint Bash Scripts"
            command: ./scripts/shellcheck.sh

          - name: "Check Docker Boot Sync Cleanup"
            command: scripts/ci/check-docker-boot-sync-cleanup.sh

          - name: "Check EOL"
            command: nix develop --quiet --command scripts/enforce-eol.sh

          - name: "Validate Swagger"
            command: nix develop --quiet path:./scripts/ci -c ./scripts/ci/validate-swagger.sh

          - name: "Print TODO List"
            command: nix develop --quiet --command scripts/todo-list.sh

          - name: "Check HLS Works"
            # cabal update so HLS's cabal v2-repl cradle has the hackage/CHaP index
            # (ephemeral pods lack the cabal home builder-new persisted).
            command: nix develop --quiet --command bash -c "rm -f cabal.project.local; cabal update; haskell-language-server lib/wallet/src/Cardano/Wallet.hs"

          - name: "Check git revision"
            command: scripts/ci/git-revision.sh

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run check
        run: ${{ matrix.command }}

